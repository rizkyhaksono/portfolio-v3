name: Build and deploy to VPS - portfolio-v3
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  IMAGE: portfolio-v3-web:latest
  IMAGE_SOURCE: https://github.com/rizkyhaksono/portfolio-v3
  SERVICE: portfolio-natee-v3_web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Next.js inlines NEXT_PUBLIC_* at build time, and prerendered pages may call
      # server-only APIs during build. Everything goes in via a BuildKit secret
      # (mounted as .env.production.local) so nothing is stored in image layers.
      - name: Write build env
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          API_URL: ${{ secrets.API_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_EMAIL_JS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAIL_JS_PUBLIC_KEY }}
          NEXT_PUBLIC_EMAIL_JS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAIL_JS_SERVICE_ID }}
          NEXT_PUBLIC_EMAIL_JS_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAIL_JS_TEMPLATE_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_RESUME_GOOGLE_DRIVE_URL: ${{ secrets.NEXT_PUBLIC_RESUME_GOOGLE_DRIVE_URL }}
          NEXT_PUBLIC_SPOTIFY_PROFILE_URL: ${{ secrets.NEXT_PUBLIC_SPOTIFY_PROFILE_URL }}
          NEXT_PUBLIC_UMAMI_SRC: ${{ secrets.NEXT_PUBLIC_UMAMI_SRC }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_UMAMI_RECORDER_SRC: ${{ secrets.NEXT_PUBLIC_UMAMI_RECORDER_SRC }}
          NEXT_PUBLIC_LEETCODE_USERNAME: ${{ secrets.NEXT_PUBLIC_LEETCODE_USERNAME }}
          NEXT_PUBLIC_CHESS_USERNAME: ${{ secrets.NEXT_PUBLIC_CHESS_USERNAME }}
          NEXT_PUBLIC_NPM_USERNAME: ${{ secrets.NEXT_PUBLIC_NPM_USERNAME }}
          GH_READ_USER_TOKEN_PERSONAL: ${{ secrets.GH_READ_USER_TOKEN_PERSONAL }}
          DEVTO_KEY: ${{ secrets.DEVTO_KEY }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          # The tracker has no fallback id any more; fail here instead of shipping without analytics.
          : "${NEXT_PUBLIC_UMAMI_SRC:?secret not set}" "${NEXT_PUBLIC_UMAMI_WEBSITE_ID:?secret not set}"
          env | grep -E '^(DOMAIN|API_URL|NEXT_PUBLIC_|SUPABASE_|GH_READ_|DEVTO_|WAKATIME_|SPOTIFY_)' \
            | grep -v '=$' > "$RUNNER_TEMP/buildenv"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
          secret-files: |
            buildenv=${{ runner.temp }}/buildenv
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # VPS is too small to build Next.js, so the image is shipped over SSH.
      # After loading, the previous image becomes dangling and is pruned by label,
      # so only one portfolio-v3 image stays on the VPS. Replica count is untouched.
      - name: Deploy to VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh && echo "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          docker save "$IMAGE" | gzip | sshpass -e ssh "$VPS" 'gunzip | docker load'
          sshpass -e ssh "$VPS" "docker service update --force --image $IMAGE $SERVICE >/dev/null \
            && docker image prune -f --filter label=org.opencontainers.image.source=$IMAGE_SOURCE"
